# Compose para o servidor da FEMA / Coolify (Build Pack: Docker Compose).
# Publica o site numa porta do servidor: http://computacao.fema.edu.br:3520
#
# Variável opcional (Environment Variables no Coolify):
#   WEB_PORT  porta pública do site (padrão: 3520)
services:
  xadrez:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3520}:80"
