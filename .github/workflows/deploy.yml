# A cada push na main: confere se a imagem Docker compila e, se compilar,
# pede ao Coolify para fazer o deploy da versão nova.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   COOLIFY_WEBHOOK  URL de deploy do recurso no Coolify (aba Webhooks do recurso)
#   COOLIFY_TOKEN    token de API do Coolify (Keys & Tokens > API tokens, permissão "deploy")

name: Deploy no Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build da imagem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compilar a imagem Docker
        run: docker build -t xadrez .

  deploy:
    name: Deploy no Coolify
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Disparar o deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Sem os segredos o deploy é pulado, não falha.
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Segredos COOLIFY_WEBHOOK/COOLIFY_TOKEN não definidos neste repositório; deploy pulado."
            exit 0
          fi
          curl --fail-with-body -sS -X GET "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
